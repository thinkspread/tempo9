#
# Every commit in a pull request must carry a Signed-off-by line for its
# author's email: the Developer Certificate of Origin (DCO in the repository
# root; CONTRIBUTING.md says why). Plain git on the runner -- no third-party
# action, and no secrets: a pull request from a fork runs this with a
# read-only token. Commit subjects are never echoed into workflow commands.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/dco_check.sh "$BASE" "$HEAD"
